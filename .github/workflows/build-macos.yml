name: Build macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos:
    name: Build universal macOS bundle
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable (Intel + Apple Silicon targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: universal-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      # No signing / notarization: no Apple Developer account, no secrets.
      - name: Build universal macOS bundle
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target universal-apple-darwin
          uploadUpdaterJson: false

      - name: Check produced bundles
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"
          ls -la "$BUNDLE/dmg"
          APP=$(ls -d "$BUNDLE/macos/"*.app)
          echo "App bundle: $APP"
          # Confirm the binary really is a universal (fat) Mach-O
          lipo -info "$APP/Contents/MacOS/"*

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: yt-music-macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: yt-music-macos-universal-app
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/YT Music.app
          if-no-files-found: error
          retention-days: 30